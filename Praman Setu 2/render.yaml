services:
  - type: web
    name: pramansetu-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w @pramansetu/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_PROVIDER
        sync: false
      - key: SEED_ADMIN_PHONE
        sync: false
